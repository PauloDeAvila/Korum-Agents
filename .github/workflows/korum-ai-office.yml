name: Korum AI Office verification

on:
  push:
    branches: [ "feat/**", "testes", "revisao" ]
    paths:
      - "ai-office/**"
      - ".github/workflows/korum-ai-office.yml"
      - "KORUM.md"
  pull_request:
    branches: [ main ]
    paths:
      - "ai-office/**"
      - ".github/workflows/korum-ai-office.yml"
      - "KORUM.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-office:
    name: Agent engine checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax verification
        run: npm run check
      - name: Unit and simulated collaboration tests
        run: npm test

  upstream-compatibility:
    name: Habblaud compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install upstream dependencies
        run: npm ci
      - name: Typecheck upstream
        run: npm run typecheck
      - name: Run upstream tests
        run: npm test
      - name: Build original application
        run: npm run build
