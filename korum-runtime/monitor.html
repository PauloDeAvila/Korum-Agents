<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Korum — Conversas AI-to-AI</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;background:#08111b;color:#eaf5f9}*{box-sizing:border-box}body{margin:0;padding:25px;max-width:1200px;margin:auto}header{padding:22px;background:#132432;border:1px solid #284455;border-radius:14px}h1{font-size:24px;margin:6px 0}h2{font-size:15px}p{color:#a0bacb}small{color:#83a5b9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{padding:18px;border:1px solid #284455;border-radius:14px;background:#111f2c}.agent{display:flex;gap:12px;justify-content:space-between;padding:12px;border-bottom:1px solid #29404d}.agent:last-child{border-bottom:0}.agent b{color:#8ce5d3}.feed{max-height:640px;overflow:auto}.message{padding:14px 0;border-bottom:1px solid #273e4e}.message:last-child{border:0}.meta{font-size:11px;color:#83b6c7}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px;color:#d7e7ec;font-size:13px;line-height:1.5}.pill{font-size:11px;padding:5px 9px;border-radius:99px;background:#183b43;color:#84e7cb;display:inline-block}.muted{color:#9bb2bf}.cap{letter-spacing:.15em;color:#82e2d1;font-size:10px;font-weight:800}.error{color:#ffc0ac}@media(max-width:850px){.grid{grid-template-columns:1fr}} </style></head><body>
<header><div class="cap">KORUM AGENTS / LIVE CONVERSATIONS</div><h1>Comunicação AI-to-AI</h1><p>Mensagens reais da rede de agentes. O Master decide, os especialistas trocam solicitações e a verificação é independente.</p><span id="status" class="pill">Conectando…</span><span id="mission" class="muted"></span></header>
<div class="grid"><section class="card"><h2>Agentes e sessões Codex</h2><div id="agents"></div></section><section class="card"><h2>Mensagens e decisões</h2><div id="messages" class="feed"></div></section></div>
<script>
const q=x=>document.getElementById(x);const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n;};
async function refresh(){try{const [a,b]=await Promise.all([fetch('/api/state'),fetch('/api/events')]);if(!a.ok)throw Error('Estado ainda não gerado');const s=await a.json(),events=await b.json();
q('status').textContent=s.status+' · '+s.steps+' turnos · '+s.masterRounds+' decisões';q('mission').textContent='   '+(s.goal||'').slice(0,120);
q('agents').replaceChildren();for(const ag of s.agents||[]){const row=el('div','agent');const left=el('div');left.append(el('b','',ag.name),el('div','meta',ag.team));row.append(left,el('span','meta',ag.threadId?'Sessão: '+ag.threadId.slice(0,8):'Ainda não iniciado'));q('agents').append(row);}
q('messages').replaceChildren();const list=events.filter(e=>e.type==='message'||e.type==='master.decision'||e.type==='verification.gate'||e.type==='mission.finished');for(const e of list.slice(-100).reverse()){const row=el('div','message'),label=e.type==='message'?e.from+' → '+e.to+' · '+e.kind:e.type;row.append(el('div','meta',e.at+' · '+label),el('div','body',e.body||e.summary||JSON.stringify(e.checks||e.status||'')));q('messages').append(row);}
}catch(error){q('status').textContent='Sem execução: '+error.message;q('status').classList.add('error');}}
refresh();setInterval(refresh,1600);
</script></body></html>
